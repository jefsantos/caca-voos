<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caça-Voos · GRU → Itália</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --bg: #0D1015;
    --panel: #151A22;
    --panel-2: #1B212B;
    --line: #252D39;
    --board: #FFB627;          /* âmbar de painel de embarque */
    --text: #E9EDF2;
    --muted: #8A94A3;
    --drop: #3ECF8E;
    --rise: #E5484D;
    --it-green: #159957;
    --it-red: #CE2B37;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', system-ui, sans-serif;
    min-height: 100vh;
  }
  .mono { font-family: 'IBM Plex Mono', monospace; }

  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 64px; }

  /* Faixa tricolore — aceno à Itália, também é o divisor do site */
  .tricolore { height: 4px; display: flex; }
  .tricolore span { flex: 1; }
  .tricolore span:nth-child(1) { background: var(--it-green); }
  .tricolore span:nth-child(2) { background: #F1F2F1; }
  .tricolore span:nth-child(3) { background: var(--it-red); }

  header { padding: 28px 0 20px; border-bottom: 1px solid var(--line); }
  .route-board {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(26px, 7vw, 44px);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--board);
    text-shadow: 0 0 24px rgba(255,182,39,0.25);
  }
  .route-board .arrow { color: var(--muted); padding: 0 6px; }
  .sub {
    margin-top: 6px; font-size: 13px; color: var(--muted);
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .sub .dot::before { content: "·"; margin-right: 14px; color: var(--line); }

  /* Cartão de embarque — melhor oferta */
  .boarding {
    margin-top: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .boarding-head {
    padding: 10px 18px;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px dashed var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .boarding-head .tag {
    color: var(--bg); background: var(--board);
    padding: 2px 8px; border-radius: 4px; font-weight: 700; letter-spacing: 0.1em;
  }
  .boarding-body {
    padding: 20px 18px;
    display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
  }
  .boarding .cities { font-weight: 800; font-size: clamp(20px, 5vw, 28px); }
  .boarding .dates { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .boarding .meta { margin-top: 10px; font-size: 12px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  .price-big {
    font-family: 'IBM Plex Mono', monospace;
    font-size: clamp(24px, 6vw, 36px); font-weight: 600;
    color: var(--board); text-align: right; white-space: nowrap;
  }
  .price-big small { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 4px; }
  .under-ceiling { color: var(--drop); }

  h2 {
    margin: 36px 0 12px;
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted);
  }

  /* Linhas do painel de partidas */
  .board-rows { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .board-row {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 12px; align-items: center;
    padding: 13px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .board-row:nth-child(even) { background: var(--panel-2); }
  .board-row:last-child { border-bottom: none; }
  .board-row .dest {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600;
    color: var(--board); font-size: 15px; letter-spacing: 0.08em;
  }
  .board-row .info { min-width: 0; }
  .board-row .when { font-weight: 500; }
  .board-row .detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .board-row .price {
    font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px;
    text-align: right; white-space: nowrap;
  }
  .board-row .price.ok { color: var(--drop); }

  /* Gráfico */
  .chart-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .legend .key { display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }

  .empty {
    margin-top: 40px; padding: 40px 20px; text-align: center;
    border: 1px dashed var(--line); border-radius: 12px; color: var(--muted);
  }
  .empty .mono { color: var(--board); }

  footer { margin-top: 44px; font-size: 12px; color: var(--muted); text-align: center; }

  /* Painel de configurações */
  .gear {
    background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    font-family: 'Archivo', sans-serif;
  }
  .gear:hover { border-color: var(--board); color: var(--board); }
  .settings {
    margin-top: 18px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px;
  }
  .settings h3 {
    font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 14px;
  }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11.5px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .field input {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 8px; padding: 9px 11px; font-size: 14px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .field input:focus { outline: none; border-color: var(--board); }
  .field small { font-size: 11px; color: var(--muted); }
  .settings .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn {
    border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px;
    font-weight: 700; cursor: pointer; font-family: 'Archivo', sans-serif;
  }
  .btn-primary { background: var(--board); color: var(--bg); }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .quota { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  .quota.over { color: var(--rise); }
  .status-msg { margin-top: 12px; font-size: 13px; }
  .status-msg.ok { color: var(--drop); }
  .status-msg.err { color: var(--rise); }
  @media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

  @media (max-width: 520px) {
    .boarding-body { grid-template-columns: 1fr; }
    .price-big { text-align: left; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .route-board { animation: glow 2.4s ease-in-out 1; }
    @keyframes glow { from { opacity: 0; } to { opacity: 1; } }
  }
</style>
</head>
<body>
<div class="tricolore"><span></span><span></span><span></span></div>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const CITY = { FCO: "Roma", MXP: "Milão", VCE: "Veneza", LIN: "Milão", CIA: "Roma", BLQ: "Bolonha", NAP: "Nápoles" };
const ROUTE_COLORS = ["#FFB627", "#3ECF8E", "#6CA0F6", "#E57BD1", "#F2724B", "#9B8CFF"];

const brl = (v, cur) =>
  new Intl.NumberFormat("pt-BR", { style: "currency", currency: cur || "BRL" }).format(v);

const dm = iso => {
  const [y, m, d] = iso.split("-");
  return `${d}/${m}`;
};

// "14h30" já vem formatado do agente; mantém compatibilidade com "PT12H35M"
const dur = iso => {
  if (!iso || iso === "?" ) return "—";
  if (!iso.startsWith("PT")) return iso;
  const h = (iso.match(/(\d+)H/) || [])[1] || "0";
  const m = (iso.match(/(\d+)M/) || [])[1] || "00";
  return `${h}h${String(m).padStart(2, "0")}`;
};

const stopsLabel = n => (n === 0 ? "direto" : n === 1 ? "1 escala" : `${n} escalas`);

// Detecta dono/repositório a partir da URL do GitHub Pages
// (jefsantos.github.io/caca-voos -> jefsantos/caca-voos)
function detectRepo() {
  const host = location.hostname;                     // jefsantos.github.io
  const seg = location.pathname.split("/").filter(Boolean); // ["caca-voos"]
  if (host.endsWith(".github.io") && seg.length >= 1)
    return { owner: host.split(".")[0], repo: seg[0] };
  return { owner: "jefsantos", repo: "caca-voos" };   // fallback
}

const tokenStore = {
  get() { try { return localStorage.getItem("cv_token") || ""; } catch { return ""; } },
  set(v) { try { localStorage.setItem("cv_token", v); } catch {} },
};

function Settings({ config, onSaved }) {
  const { owner, repo } = detectRepo();
  const [form, setForm] = useState({
    origin: config.origin || "GRU",
    destinations: (config.destinations || []).join(","),
    departure_start: config.departure_start || "2026-09-08",
    departure_end: config.departure_end || "2026-09-12",
    stay_days: (config.stay_days || []).join(","),
    price_ceiling: config.price_ceiling || 4500,
    searches_per_run: config.searches_per_run || 3,
  });
  const [token, setToken] = useState(tokenStore.get());
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  // Estimativa de cota: dias de ida x estadias x destinos + buscas/dia x 30
  const quota = useMemo(() => {
    try {
      const days = Math.round((new Date(form.departure_end) - new Date(form.departure_start)) / 86400000) + 1;
      const stays = form.stay_days.split(",").filter(Boolean).length;
      const dests = form.destinations.split(",").filter(Boolean).length;
      const combos = days * stays * dests;
      const monthly = Number(form.searches_per_run) * 30;
      const cycle = Math.ceil(combos / Math.max(1, Number(form.searches_per_run)));
      return { combos, monthly, cycle, valid: days > 0 && stays > 0 && dests > 0 };
    } catch { return { valid: false }; }
  }, [form]);

  const buildConfig = () => ({
    origin: form.origin.trim().toUpperCase(),
    destinations: form.destinations.split(",").map(s => s.trim().toUpperCase()).filter(Boolean),
    departure_start: form.departure_start,
    departure_end: form.departure_end,
    stay_days: form.stay_days.split(",").map(s => parseInt(s.trim(), 10)).filter(n => n > 0),
    searches_per_run: Math.max(1, parseInt(form.searches_per_run, 10) || 3),
    price_ceiling: Number(form.price_ceiling) || 4500,
    currency: config.currency || "BRL",
  });

  const gh = (path, opts = {}) =>
    fetch(`https://api.github.com/repos/${owner}/${repo}${path}`, {
      ...opts,
      headers: {
        "Authorization": `Bearer ${token.trim()}`,
        "Accept": "application/vnd.github+json",
        ...(opts.headers || {}),
      },
    });

  const save = async () => {
    if (!token.trim()) { setMsg({ t: "err", x: "Cole seu token do GitHub no campo acima para salvar." }); return; }
    if (!quota.valid) { setMsg({ t: "err", x: "Confira as datas e os campos — algo ficou vazio ou invertido." }); return; }
    setBusy(true); setMsg(null);
    try {
      tokenStore.set(token.trim());
      const newCfg = JSON.stringify(buildConfig(), null, 2) + "\n";
      // pega o sha atual do arquivo (obrigatório para atualizar)
      const cur = await gh(`/contents/docs/config.json?ref=main`);
      const sha = cur.ok ? (await cur.json()).sha : undefined;
      const put = await gh(`/contents/docs/config.json`, {
        method: "PUT",
        body: JSON.stringify({
          message: "config: atualizado pelo painel",
          content: btoa(unescape(encodeURIComponent(newCfg))),
          sha, branch: "main",
        }),
      });
      if (!put.ok) throw new Error(`GitHub respondeu ${put.status}`);
      setMsg({ t: "ok", x: "Configurações salvas! Valem a partir da próxima execução — ou toque em Rodar agora." });
      onSaved(buildConfig());
    } catch (e) {
      setMsg({ t: "err", x: `Não foi possível salvar (${e.message}). Confira se o token tem permissão de Contents no repositório.` });
    }
    setBusy(false);
  };

  const runNow = async () => {
    if (!token.trim()) { setMsg({ t: "err", x: "Cole seu token do GitHub para disparar uma execução." }); return; }
    setBusy(true); setMsg(null);
    try {
      tokenStore.set(token.trim());
      const r = await gh(`/actions/workflows/caca-voos.yml/dispatches`, {
        method: "POST",
        body: JSON.stringify({ ref: "main" }),
      });
      if (r.status !== 204) throw new Error(`GitHub respondeu ${r.status}`);
      setMsg({ t: "ok", x: "Execução disparada! Em ~2 minutos, recarregue a página para ver os dados novos." });
    } catch (e) {
      setMsg({ t: "err", x: `Não foi possível disparar (${e.message}). Confira se o token tem permissão de Actions.` });
    }
    setBusy(false);
  };

  return (
    <section className="settings" aria-label="Configurações">
      <h3>Configurações da busca</h3>
      <div className="grid2">
        <div className="field">
          <label>Origem (IATA)</label>
          <input value={form.origin} onChange={e => set("origin", e.target.value)} placeholder="GRU" />
        </div>
        <div className="field">
          <label>Destinos (IATA, por vírgula)</label>
          <input value={form.destinations} onChange={e => set("destinations", e.target.value)} placeholder="FCO,MXP,VCE" />
          <small>Roma FCO · Milão MXP · Veneza VCE · Nápoles NAP · Bolonha BLQ</small>
        </div>
        <div className="field">
          <label>Ida — de</label>
          <input type="date" value={form.departure_start} onChange={e => set("departure_start", e.target.value)} />
        </div>
        <div className="field">
          <label>Ida — até</label>
          <input type="date" value={form.departure_end} onChange={e => set("departure_end", e.target.value)} />
        </div>
        <div className="field">
          <label>Dias de estadia (por vírgula)</label>
          <input value={form.stay_days} onChange={e => set("stay_days", e.target.value)} placeholder="5,6" />
          <small>A volta é calculada: ida + estadia</small>
        </div>
        <div className="field">
          <label>Teto do alerta ({config.currency || "BRL"})</label>
          <input type="number" value={form.price_ceiling} onChange={e => set("price_ceiling", e.target.value)} />
        </div>
        <div className="field">
          <label>Buscas por dia</label>
          <input type="number" min="1" max="10" value={form.searches_per_run} onChange={e => set("searches_per_run", e.target.value)} />
        </div>
        <div className="field">
          <label>Token do GitHub (fica só neste navegador)</label>
          <input type="password" value={token} onChange={e => setToken(e.target.value)} placeholder="github_pat_..." />
          <small>Fine-grained token com Contents + Actions (read/write) só neste repositório</small>
        </div>
      </div>
      {quota.valid && (
        <p className={"quota" + (quota.monthly > 100 ? " over" : "")}>
          {quota.combos} combinações · ciclo completo a cada {quota.cycle} dias · ~{quota.monthly} buscas/mês
          {quota.monthly > 100 ? " — ACIMA da cota gratuita da SerpAPI (~100/mês)!" : " — dentro da cota gratuita."}
        </p>
      )}
      <div className="actions">
        <button className="btn btn-primary" disabled={busy} onClick={save}>Salvar configurações</button>
        <button className="btn btn-ghost" disabled={busy} onClick={runNow}>▶ Rodar agora</button>
      </div>
      {msg && <p className={"status-msg " + (msg.t === "ok" ? "ok" : "err")}>{msg.x}</p>}
    </section>
  );
}

function PriceChart({ routes }) {
  // séries: uma por rota, apenas rotas com 2+ observações
  const series = useMemo(() => {
    return Object.entries(routes)
      .map(([key, r]) => ({
        key,
        label: (() => {
          const [dest, dep, ret] = key.split("|");
          return `${dest} ${dm(dep)}–${dm(ret)}`;
        })(),
        points: (r.observations || []).map(o => ({ t: new Date(o.checked_at).getTime(), p: o.price })),
      }))
      .filter(s => s.points.length >= 2)
      .sort((a, b) => a.points[a.points.length - 1].p - b.points[b.points.length - 1].p)
      .slice(0, 6);
  }, [routes]);

  if (series.length === 0)
    return <p style={{ fontSize: 13, color: "var(--muted)" }}>
      O gráfico aparece a partir da segunda execução, quando houver histórico para comparar.
    </p>;

  const W = 760, H = 260, PAD = { l: 64, r: 12, t: 12, b: 28 };
  const allT = series.flatMap(s => s.points.map(p => p.t));
  const allP = series.flatMap(s => s.points.map(p => p.p));
  const tMin = Math.min(...allT), tMax = Math.max(...allT);
  const pMin = Math.min(...allP) * 0.98, pMax = Math.max(...allP) * 1.02;
  const x = t => PAD.l + ((t - tMin) / Math.max(1, tMax - tMin)) * (W - PAD.l - PAD.r);
  const y = p => H - PAD.b - ((p - pMin) / Math.max(1, pMax - pMin)) * (H - PAD.t - PAD.b);

  const yTicks = [pMin, (pMin + pMax) / 2, pMax];

  return (
    <div>
      <div className="legend">
        {series.map((s, i) => (
          <span key={s.key}>
            <span className="key" style={{ background: ROUTE_COLORS[i % ROUTE_COLORS.length] }}></span>
            <span className="mono">{s.label}</span>
          </span>
        ))}
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }} role="img"
           aria-label="Evolução dos preços por rota">
        {yTicks.map((p, i) => (
          <g key={i}>
            <line x1={PAD.l} x2={W - PAD.r} y1={y(p)} y2={y(p)} stroke="var(--line)" strokeDasharray="3 4" />
            <text x={PAD.l - 8} y={y(p) + 4} textAnchor="end" fontSize="10.5"
                  fill="var(--muted)" fontFamily="'IBM Plex Mono', monospace">
              {Math.round(p).toLocaleString("pt-BR")}
            </text>
          </g>
        ))}
        {series.map((s, i) => {
          const color = ROUTE_COLORS[i % ROUTE_COLORS.length];
          const d = s.points.map((pt, j) => `${j === 0 ? "M" : "L"}${x(pt.t)},${y(pt.p)}`).join(" ");
          const last = s.points[s.points.length - 1];
          return (
            <g key={s.key}>
              <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" />
              <circle cx={x(last.t)} cy={y(last.p)} r="3.5" fill={color} />
            </g>
          );
        })}
        <text x={PAD.l} y={H - 8} fontSize="10.5" fill="var(--muted)"
              fontFamily="'IBM Plex Mono', monospace">{new Date(tMin).toLocaleDateString("pt-BR")}</text>
        <text x={W - PAD.r} y={H - 8} textAnchor="end" fontSize="10.5" fill="var(--muted)"
              fontFamily="'IBM Plex Mono', monospace">{new Date(tMax).toLocaleDateString("pt-BR")}</text>
      </svg>
    </div>
  );
}

function App() {
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);
  const [config, setConfig] = useState(null);
  const [showSettings, setShowSettings] = useState(false);

  useEffect(() => {
    fetch(`data.json?t=${Date.now()}`)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(setData)
      .catch(e => setError(e.message));
    fetch(`config.json?t=${Date.now()}`)
      .then(r => (r.ok ? r.json() : null))
      .then(setConfig)
      .catch(() => setConfig(null));
  }, []);

  if (error)
    return (
      <div className="wrap">
        <header><div className="route-board">GRU <span className="arrow">→</span> ITA</div></header>
        <div className="empty">
          <p className="mono" style={{ marginBottom: 8 }}>SEM DADOS NO PAINEL</p>
          <p>Ainda não existe <span className="mono">data.json</span> — ele é gerado na primeira execução do agente. Rode o workflow em Actions e recarregue.</p>
        </div>
      </div>
    );

  if (!data) return <div className="wrap"><p style={{ padding: "40px 0", color: "var(--muted)" }}>Carregando painel…</p></div>;

  const best = data.offers[0];
  const generated = new Date(data.generated_at);
  const effective = config || {
    origin: data.origin, destinations: data.destinations,
    price_ceiling: data.price_ceiling, currency: data.currency,
  };

  // Mostra só os destinos da configuração atual (ignora rotas antigas)
  const activeDests = effective.destinations || data.destinations || [];
  const byDest = {};
  for (const o of data.offers) {
    if (activeDests.length && !activeDests.includes(o.destination)) continue;
    (byDest[o.destination] = byDest[o.destination] || []).push(o);
  }
  const destOrder = Object.keys(byDest).sort((a, b) => byDest[a][0].price - byDest[b][0].price);

  return (
    <div className="wrap">
      <header>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12 }}>
          <div className="route-board">
            {effective.origin || data.origin} <span className="arrow">→</span> ITÁLIA
          </div>
          <button className="gear" onClick={() => setShowSettings(s => !s)}>
            ⚙ Configurações
          </button>
        </div>
        <div className="sub">
          <span>Atualizado em {generated.toLocaleDateString("pt-BR")} às {generated.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</span>
          <span className="dot">Alerta abaixo de <span className="mono">{brl(effective.price_ceiling ?? data.price_ceiling, data.currency)}</span></span>
        </div>
      </header>

      {showSettings && config !== undefined && (
        <Settings config={effective} onSaved={setConfig} />
      )}

      {best && (
        <section className="boarding" aria-label="Melhor oferta">
          <div className="boarding-head">
            <span>Melhor oferta do dia</span>
            {best.price <= data.price_ceiling && <span className="tag">ABAIXO DO TETO</span>}
          </div>
          <div className="boarding-body">
            <div>
              <div className="cities">
                São Paulo → {CITY[best.destination] || best.destination}{" "}
                <span className="mono" style={{ color: "var(--muted)", fontWeight: 400, fontSize: "0.7em" }}>
                  {best.destination}
                </span>
              </div>
              <div className="dates">
                Ida {dm(best.departure)} · volta {dm(best.return_date)}
              </div>
              <div className="meta">
                <span>Cia <span className="mono">{best.carrier}</span></span>
                <span>Ida: {dur(best.duration_outbound)}, {stopsLabel(best.stops_outbound)}</span>
                {best.google_flights_url &&
                  <a href={best.google_flights_url} target="_blank" rel="noopener"
                     style={{ color: "var(--board)" }}>Abrir no Google Flights ↗</a>}
              </div>
            </div>
            <div className={"price-big" + (best.price <= data.price_ceiling ? " under-ceiling" : "")}>
              <small>total ida e volta</small>
              {brl(best.price, best.currency)}
            </div>
          </div>
        </section>
      )}

      {destOrder.map(dest => (
        <section key={dest}>
          <h2>{CITY[dest] || dest} · {dest}</h2>
          <div className="board-rows">
            {byDest[dest].slice(0, 3).map((o, i) => {
              const checkedToday = (data.checked_today || []).includes(`${o.destination}|${o.departure}|${o.return_date}`);
              return (
                <a className="board-row" key={i} href={o.google_flights_url || "#"}
                   target="_blank" rel="noopener"
                   style={{ textDecoration: "none", color: "inherit", cursor: "pointer" }}>
                  <span className="dest">{o.destination}</span>
                  <span className="info">
                    <div className="when">
                      Ida {dm(o.departure)} → volta {dm(o.return_date)}
                      {checkedToday && <span style={{ marginLeft: 8, fontSize: 10, color: "var(--drop)", letterSpacing: "0.1em" }}>● HOJE</span>}
                    </div>
                    <div className="detail">
                      {o.carrier} · ida {dur(o.duration_outbound)} · {stopsLabel(o.stops_outbound)} · toque para abrir no Google Flights
                    </div>
                  </span>
                  <span className={"price " + (o.price <= data.price_ceiling ? "ok" : "")}>
                    {brl(o.price, o.currency)}
                  </span>
                </a>
              );
            })}
          </div>
        </section>
      ))}

      <section>
        <h2>Evolução dos preços</h2>
        <div className="chart-card">
          <PriceChart routes={data.routes} />
        </div>
      </section>

      <footer>
        Caça-Voos · preços do Google Flights via SerpAPI · o painel cobre todas as rotas em rodízio, algumas verificadas em dias anteriores
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
